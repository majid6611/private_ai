worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=login:1m rate=30r/m;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    set $api_backend backend:8000;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://$api_backend$request_uri;
      proxy_read_timeout 20s;
      add_header Cache-Control no-store always;
    }
    location /api/ {
      proxy_pass http://$api_backend$request_uri;
      proxy_read_timeout 20s;
      add_header Cache-Control no-store always;
    }
    location /internal/ { return 404; }
    location /health/ { proxy_pass http://$api_backend$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
